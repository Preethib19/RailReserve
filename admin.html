<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RailReserve Admin</title><link rel="stylesheet" href="style.css"></head><body>
<header><a class="logo" href="/">🚆 RailReserve <small>ADMIN</small></a><nav><a href="/">Back to Website</a></nav></header>
<main class="section"><div class="head"><div><small>CONTROL PANEL</small><h1>Admin Dashboard</h1></div><button class="primary" onclick="load()">Refresh</button></div>
<div id="authError" class="empty hidden"></div><div class="card adminInfo"><b>Shared SQL Database</b><p>PostgreSQL/Supabase tables: <code>profiles</code>, <code>trains</code>, <code>bookings</code>, <code>payments</code>.<br>All devices use this same database.</p></div>
<div class="stats"><div><span>Users</span><b id="uc">0</b></div><div><span>Bookings</span><b id="bc">0</b></div><div><span>Payments</span><b id="pc">0</b></div></div>
<div class="card"><h2>Bookings</h2><div id="bookings">Loading...</div></div><br><div class="card"><h2>Users</h2><div id="users">Loading...</div></div><br><div class="card"><h2>Payments</h2><div id="payments">Loading...</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script><script>
const E=id=>document.getElementById(id);let admin=false;
async function load(){if(!supabaseClient)return;const {data:{user}}=await supabaseClient.auth.getUser();if(!user){return fail('Please log in with the admin account from the main website, then open Admin again.')}const {data:p,error:pe}=await supabaseClient.from('profiles').select('role').eq('id',user.id).single();if(pe||p?.role!=='ADMIN')return fail('This account is not an admin account.');admin=true;E('authError').classList.add('hidden');const [u,b,pm]=await Promise.all([supabaseClient.from('profiles').select('name,email,mobile,role').order('created_at',{ascending:false}),supabaseClient.from('bookings').select('*').order('created_at',{ascending:false}),supabaseClient.from('payments').select('*').order('created_at',{ascending:false})]);if(u.error||b.error||pm.error)return fail((u.error||b.error||pm.error).message);E('uc').textContent=u.data.length;E('bc').textContent=b.data.length;E('pc').textContent=pm.data.length;E('users').innerHTML=u.data.length?u.data.map(x=>`<div class="row"><b>${esc(x.name)}</b><span>${esc(x.email)}</span><span>${esc(x.mobile)}</span><span>${x.role}</span></div>`).join(''):'No users';E('bookings').innerHTML=b.data.length?b.data.map(x=>`<div class="row"><b>${x.ticket_number}</b><span>${esc(x.passenger_name)}</span><span>${esc(x.train_name)}</span><span>${x.travel_class}</span><span>${x.status}</span><span>₹${x.fare}</span></div>`).join(''):'No bookings';E('payments').innerHTML=pm.data.length?pm.data.map(x=>`<div class="row"><b>${x.payment_id}</b><span>${x.ticket_number}</span><span>${x.method}</span><span>₹${x.amount}</span><span>${x.status}</span></div>`).join(''):'No payments'}
function fail(m){E('authError').textContent=m;E('authError').classList.remove('hidden')}function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}load();
</script></body></html>
